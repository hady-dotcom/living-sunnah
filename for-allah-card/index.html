<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="For Allah?">
<meta name="theme-color" content="#F2F5FA"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><title>For Allah?</title>
<style>
:root{--blue:#007AFF;--ink:#1C1C1E;--sub:#6E6E73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink);
background:radial-gradient(120% 80% at 20% 0%,#DCE9FF 0%,#F2F5FA 55%,#FFFFFF 100%);
display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:420px;padding:32px 24px 24px;border-radius:28px;background:rgba(255,255,255,.62);
-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 40px rgba(0,60,140,.10)}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
p.q{font-size:19px;color:var(--sub);margin:0 0 24px;line-height:1.35}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid rgba(60,60,67,.18);background:rgba(255,255,255,.8);color:var(--ink);outline:none;margin-bottom:20px}
input:focus{border-color:var(--blue)}
button{display:block;width:100%;font:inherit;font-size:17px;font-weight:600;padding:16px;border-radius:14px;border:0;margin-top:10px;cursor:pointer}
.yes{background:var(--blue);color:#fff}.no{background:rgba(118,118,128,.12);color:var(--blue)}
button:active{opacity:.75}
.log{margin-top:20px;font-size:13px;color:var(--sub);text-align:center}
.done{font-size:17px;color:var(--sub);margin:4px 0 0;min-height:22px;text-align:center}
</style></head><body>
<main class="card" role="dialog" aria-labelledby="t">
<h1 id="t">Is this for Allah?</h1>
<p class="q">Could you be spending your time better?</p>
<input id="intent" maxlength="80" placeholder="My intention (optional)" aria-label="Intention">
<button class="yes" id="yes">Yes, for Allah</button>
<button class="no" id="no">Not now</button>
<p class="done" id="msg" aria-live="polite"></p>
<div class="log" id="log"></div>
</main>
<script>
const K='forAllahLog';const today=()=>new Date().toLocaleDateString('en-CA');
const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}};
function show(){const d=load()[today()]||{yes:0,no:0};document.getElementById('log').textContent=`Today: ${d.yes} for Allah, ${d.no} not now. Kept only on this phone.`}
function pick(k){const all=load(),t=today();all[t]=all[t]||{yes:0,no:0,intentions:[]};all[t][k]++;
const i=document.getElementById('intent').value.trim();if(i){all[t].intentions=all[t].intentions||[];all[t].intentions.push({k,i,at:new Date().toISOString()})}
localStorage.setItem(K,JSON.stringify(all));document.getElementById('intent').value='';
document.getElementById('msg').textContent=k==='yes'?'Bismillah. Go ahead.':'Okay. Maybe pause for a moment.';show()}
document.getElementById('yes').onclick=()=>pick('yes');document.getElementById('no').onclick=()=>pick('no');show();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
